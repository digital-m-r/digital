<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu foto — Foro Digital 2026 BMM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Rajdhani:wght@500;600;700&display=swap');
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    min-height:100vh; min-height:100dvh;
    font-family:'Rajdhani',sans-serif; color:#EAF0FF;
    background:linear-gradient(160deg,#0A0E27,#1B0F3D);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px; gap:18px; text-align:center;
  }
  h1{ font-family:'Orbitron',sans-serif; font-size:clamp(20px,6vw,30px); font-weight:900; }
  h1 span{ background:linear-gradient(90deg,#3E8EFF,#B24BF3,#FFA53E); -webkit-background-clip:text; background-clip:text; color:transparent; }
  img{ width:100%; max-width:760px; border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.5); display:none; }
  p{ color:#93A0C4; font-weight:600; font-size:17px; max-width:520px; }
  a.btn{
    display:none; width:100%; max-width:420px; padding:16px 20px;
    font-family:'Orbitron',sans-serif; font-weight:800; font-size:17px; letter-spacing:1px;
    color:#fff; text-decoration:none; border-radius:16px;
    background:linear-gradient(90deg,#3E8EFF,#B24BF3);
    box-shadow:0 8px 24px rgba(178,75,243,.35);
  }
  .ayuda{ font-size:14px; opacity:.85; display:none; }
</style>
</head>
<body>
  <h1>Foro Digital <span>2026</span></h1>
  <p id="estado">Cargando tu foto…</p>
  <img id="foto" alt="Tu foto del Foro Digital 2026">
  <a id="descargar" class="btn" download="foto-foro-digital-2026.jpg">⬇ DESCARGAR FOTO</a>
  <p id="ayuda" class="ayuda">Si el botón no la descarga, mantén presionada la foto y elige “Guardar imagen”.</p>

<script type="module">
  import { db, doc, getDoc, COLECCION_FOTOS } from "./js/firebase-foto.js";

  const estado = document.getElementById("estado");
  const id = new URLSearchParams(location.search).get("id");

  async function cargar(){
    if (!id){ estado.textContent = "El enlace no es válido."; return; }
    try{
      const snap = await getDoc(doc(db, COLECCION_FOTOS, id));
      if (!snap.exists()){
        estado.textContent = "No encontramos esta foto. Puede que el enlace sea incorrecto o que ya haya sido eliminada.";
        return;
      }
      const dataUrl = snap.data().imagen;
      const img = document.getElementById("foto");
      img.src = dataUrl;
      img.style.display = "block";

      // blob para que la descarga funcione bien en celulares
      const blob = await (await fetch(dataUrl)).blob();
      const a = document.getElementById("descargar");
      a.href = URL.createObjectURL(blob);
      a.style.display = "block";
      document.getElementById("ayuda").style.display = "block";
      estado.textContent = "¡Aquí está tu foto de recuerdo!";
    }catch(err){
      console.error(err);
      estado.textContent = "No pudimos cargar la foto. Revisa tu conexión e inténtalo de nuevo.";
    }
  }
  cargar();
</script>
</body>
</html>
