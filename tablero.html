<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMM Play - Tablero Admin</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial;
            background: #e9ecef;
            margin: 0;
            padding: 18px;
            color: #1a1a1a;
        }

        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 16px; flex-wrap: wrap; gap: 12px;
        }
        .brand { display: flex; align-items: center; gap: 16px; }
        .brand img.logo-izq { height: 26px; object-fit: contain; }
        .brand img.logo-der { height: 55px; object-fit: contain; }
        .brand h1 { color: #0032A0; margin: 0; font-size: 22px; }
        .brand .sub { color: #666; font-size: 13px; }

        .controls button {
            background: white; border: 2px solid #0032A0; color: #0032A0; padding: 12px 20px;
            border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 15px; margin-left: 8px;
        }
        .controls button.primary { background: #0032A0; color: white; }
        .controls button:disabled { opacity: .35; cursor: not-allowed; }

        .layout { display: grid; grid-template-columns: 1fr 340px; gap: 18px; align-items: start; }
        @media (max-width: 1050px) { .layout { grid-template-columns: 1fr; } }

        .board-wrap { background: white; border-radius: 18px; padding: 14px; box-shadow: 0 5px 15px rgba(0,0,0,.08); }
        .board { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(5, 1fr); gap: 6px; aspect-ratio: 6/5; }
        .cell {
            position: relative; border-radius: 10px; padding: 6px; display: flex; flex-direction: column;
            overflow: hidden; color: white; border: 2px solid rgba(255,255,255,.4);
        }
        .cell .num { font-weight: 800; font-size: 18px; text-shadow: 0 1px 3px rgba(0,0,0,.35); }
        .cell .emoji { position: absolute; top: 6px; right: 8px; font-size: 20px; }
        .cell .special {
            position: absolute; bottom: 4px; right: 6px; font-size: 11px; font-weight: 700;
            background: rgba(0,0,0,.4); padding: 2px 6px; border-radius: 6px;
        }
        .cell .tokens { margin-top: auto; display: flex; flex-wrap: wrap; gap: 3px; }
        .token { width: 26px; height: 26px; background: white; border-radius: 50%; padding: 2px; overflow: hidden; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
        .token img { width: 100%; height: 100%; object-fit: contain; }

        .sidebar > div { background: white; border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 5px 15px rgba(0,0,0,.06); }
        .sidebar h3 { font-size: 15px; margin: 0 0 10px; color: #0032A0; }
        .turn-row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; font-size: 14px; margin-bottom: 4px; }
        .turn-row.active { background: #dbeafe; border: 1px solid #0032A0; }
        .av-img { width: 26px; height: 26px; object-fit: contain; border-radius: 50%; background: #f8f9fa; padding: 2px; }
        .turn-row .nm { flex: 1; }
        .turn-row .pt { font-size: 12px; color: #666; font-weight: 700; }

        .log { font-size: 12.5px; color: #666; max-height: 200px; overflow-y: auto; }
        .log div { padding: 5px 0; border-bottom: 1px solid #eee; }

        .overlay { position: fixed; inset: 0; background: rgba(20,20,40,.75); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
        .overlay.hidden { display: none; }
        .modal { background: white; border-radius: 20px; padding: 34px; max-width: 640px; width: 100%; text-align: center; }
        .modal h2 { font-size: 26px; margin-bottom: 10px; color: #0032A0; }
        .modal p { color: #555; font-size: 16px; line-height: 1.55; }
        .winner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 20px; }
        .winner-btn { background: #f8f9fa; border: 2px solid #ddd; border-radius: 12px; padding: 14px 10px; cursor: pointer; font-size: 14px; }
        .winner-btn img { width: 34px; height: 34px; object-fit: contain; }
        .winner-btn:hover { border-color: #0032A0; }
        .q-cat-badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 6px 16px; border-radius: 999px; color: white; margin-bottom: 14px; }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="brand">
            <img src="img/logo_beiersdorf.png" alt="Beiersdorf" class="logo-izq">
            <img src="img/logo_digital.png" alt="Digital" class="logo-der">
            <div><h1>🎲 Digital Party — Tablero</h1><div class="sub">RPA → Dashboards → Power Apps → Power Automate → IA</div></div>
        </div>
        <div class="controls">
            <button id="btnIniciar" class="primary">▶ Iniciar partida</button>
            <button id="btnFinalizar">🏁 Finalizar partida</button>
        </div>
    </div>

    <div class="layout">
        <div class="board-wrap">
            <div class="board" id="board"></div>
        </div>

        <div class="sidebar">
            <div><h3>🎯 Turno</h3><div id="turnList"></div></div>
            <div><h3>🥇 Ranking (puntos)</h3><div id="rankList"></div></div>
            <div><h3>📜 Actividad</h3><div class="log" id="logList"></div></div>
        </div>
    </div>

    <!-- Mirror de pregunta -->
    <div class="overlay hidden" id="qOverlay">
        <div class="modal">
            <span class="q-cat-badge" id="qCatBadge"></span>
            <h2 id="qJugadorTitulo"></h2>
            <p id="qTexto" style="font-size: 19px; color: #1a1a1a; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- Minijuego -->
    <div class="overlay hidden" id="mjOverlay">
        <div class="modal">
            <div style="font-size: 48px;">🎉</div>
            <h2 id="mjTitulo"></h2>
            <p id="mjInstrucciones"></p>
            <p style="margin-top: 10px; font-size: 14px; color: #666;">El jugador que activó el reto avanzará <strong id="mjDiceVal"></strong> casillas si su equipo gana.</p>
            <h3 style="margin-top: 20px; font-size: 15px; color: #666;">Selecciona al ganador:</h3>
            <div class="winner-grid" id="mjWinnerGrid"></div>
        </div>
    </div>

    <!-- Fin de partida -->
    <div class="overlay hidden" id="finOverlay">
        <div class="modal">
            <div style="font-size: 48px;">🏆</div>
            <h2>¡Partida terminada!</h2>
            <div id="finRanking" style="margin-top: 16px; text-align: left;"></div>
        </div>
    </div>

<script>
    // ============================================================
    // FIREBASE
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyBcUvlkAYzZqQluQ_xtRpz_4DFWNnfsx-k",
        authDomain: "bmm-digital-party.firebaseapp.com",
        projectId: "bmm-digital-party",
        storageBucket: "bmm-digital-party.firebasestorage.app",
        messagingSenderId: "354189165898",
        appId: "1:354189165898:web:d9d18278172ab0198e6db3",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ============================================================
    // TABLERO (misma configuración que embajador.html)
    // ============================================================
    const CATEGORIES = {
        RPA:           { id:'RPA',           label:'RPA',                      emoji:'🤖', color:'#FF6B6B' },
        DASHBOARDS:    { id:'DASHBOARDS',    label:'Dashboards',                emoji:'📊', color:'#FFB84D' },
        POWERAPPS:     { id:'POWERAPPS',     label:'Power Apps',                emoji:'📱', color:'#4CD97B' },
        POWERAUTOMATE: { id:'POWERAUTOMATE', label:'Power Automate',            emoji:'⚡', color:'#1368ce' },
        IA:            { id:'IA',            label:'Inteligencia Artificial',   emoji:'🧠', color:'#8b5cf6' },
    };
    const CATEGORY_ORDER = ['RPA','DASHBOARDS','POWERAPPS','POWERAUTOMATE','IA'];
    const BOARD_SIZE = 30;
    const MINIGAME_SQUARES = [8, 16, 24];
    const LADDERS = { 4:14, 9:21, 17:27 };
    const SNAKES  = { 26:10, 22:13, 12:2 };

    function categoriaDeCasilla(n) { return CATEGORY_ORDER[(n - 1) % 5]; }

    function getGridPosition(n) {
        const row = Math.floor((n - 1) / 6);
        let col = (n - 1) % 6;
        if (row % 2 === 1) col = 5 - col;
        return { row, col };
    }

    // ============================================================
    // CONSTRUIR TABLERO ESTÁTICO
    // ============================================================
    const boardEl = document.getElementById('board');
    for (let n = 1; n <= BOARD_SIZE; n++) {
        const { row, col } = getGridPosition(n);
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = `cell-${n}`;
        cell.style.gridRow = 5 - row;
        cell.style.gridColumn = col + 1;

        let bg, emoji = '', special = '';
        if (MINIGAME_SQUARES.includes(n)) {
            bg = '#d89e00'; emoji = '⭐'; special = 'RETO GRUPAL';
        } else if (LADDERS[n]) {
            bg = CATEGORIES[categoriaDeCasilla(n)].color; emoji = '🪜'; special = `→ ${LADDERS[n]}`;
        } else if (SNAKES[n]) {
            bg = CATEGORIES[categoriaDeCasilla(n)].color; emoji = '🐍'; special = `→ ${SNAKES[n]}`;
        } else {
            bg = CATEGORIES[categoriaDeCasilla(n)].color; emoji = CATEGORIES[categoriaDeCasilla(n)].emoji;
        }
        if (n === BOARD_SIZE) emoji = '🏆';

        cell.style.background = bg;
        cell.innerHTML = `<div class="num">${n}</div><div class="emoji">${emoji}</div>${special ? `<div class="special">${special}</div>` : ''}<div class="tokens" id="tokens-${n}"></div>`;
        boardEl.appendChild(cell);
    }

    // ============================================================
    // DATOS EN VIVO
    // ============================================================
    let jugadores = [];
    let estado = null;

    db.collection('jugadores').orderBy('creado', 'asc').onSnapshot((snap) => {
        jugadores = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
        renderTokens();
        renderTurnList();
        renderRanking();
    });

    db.collection('partida').doc('estado').onSnapshot((snap) => {
        estado = snap.data();
        renderTurnList();
        renderLog();
        renderOverlays();
        document.getElementById('btnIniciar').disabled = !estado || estado.fase !== 'lobby';
    });

    function renderTokens() {
        document.querySelectorAll('[id^="tokens-"]').forEach(el => el.innerHTML = '');
        jugadores.forEach(j => {
            if (j.posicion >= 1) {
                const t = document.getElementById(`tokens-${j.posicion}`);
                if (t) {
                    const chip = document.createElement('div');
                    chip.className = 'token';
                    chip.title = j.nombre;
                    chip.innerHTML = `<img src="${j.avatar}" alt="${j.nombre}">`;
                    t.appendChild(chip);
                }
            }
        });
    }

    function renderTurnList() {
        const el = document.getElementById('turnList');
        if (!estado || !(estado.turnOrder || []).length) {
            el.innerHTML = `<div style="color:#666; font-size:13px;">Registra jugadores y presiona "Iniciar partida".</div>`;
            return;
        }
        el.innerHTML = estado.turnOrder.map(id => {
            const j = jugadores.find(x => x.id === id);
            if (!j) return '';
            const active = estado.jugadorActivo === id;
            return `<div class="turn-row ${active ? 'active' : ''}"><img class="av-img" src="${j.avatar}" alt=""><span class="nm">${j.nombre}${j.terminado ? ' 🏆' : ''}</span><span class="pt">${j.puntos || 0} pts</span></div>`;
        }).join('');
    }

    function renderRanking() {
        const sorted = jugadores.slice().sort((a, b) => (b.puntos || 0) - (a.puntos || 0));
        document.getElementById('rankList').innerHTML = sorted.map((j, i) => `
            <div class="turn-row"><span>${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '▫️'}</span><img class="av-img" src="${j.avatar}" alt=""><span class="nm">${j.nombre}</span><span class="pt">${j.puntos || 0} pts</span></div>
        `).join('') || `<div style="color:#666; font-size:13px;">Aún no hay jugadores.</div>`;
    }

    function renderLog() {
        const logs = (estado && estado.log) || [];
        document.getElementById('logList').innerHTML = logs.slice().reverse().map(l => `<div>${l}</div>`).join('') || '<div style="color:#666">Sin actividad todavía.</div>';
    }

    function renderOverlays() {
        const qOv = document.getElementById('qOverlay');
        const mjOv = document.getElementById('mjOverlay');
        const finOv = document.getElementById('finOverlay');
        qOv.classList.add('hidden'); mjOv.classList.add('hidden'); finOv.classList.add('hidden');
        if (!estado) return;

        if (estado.fase === 'pregunta' && estado.preguntaActualId) {
            db.collection('preguntas').doc(estado.preguntaActualId).get().then((qSnap) => {
                const q = qSnap.data();
                if (!q) return;
                const cat = CATEGORIES[q.categoria];
                document.getElementById('qCatBadge').textContent = `${cat.emoji} ${cat.label}`;
                document.getElementById('qCatBadge').style.background = cat.color;
                document.getElementById('qJugadorTitulo').textContent = `${estado.jugadorPreguntaNombre} está respondiendo...`;
                document.getElementById('qTexto').textContent = q.pregunta;
                qOv.classList.remove('hidden');
            });
        }

        if (estado.fase === 'minijuego' && estado.minijuegoActivo) {
            const mj = estado.minijuegoActivo;
            document.getElementById('mjTitulo').textContent = mj.titulo;
            document.getElementById('mjInstrucciones').textContent = mj.instrucciones;
            document.getElementById('mjDiceVal').textContent = mj.diceValue;
            document.getElementById('mjWinnerGrid').innerHTML = jugadores.map(j => `
                <div class="winner-btn" data-id="${j.id}"><img src="${j.avatar}" alt=""><br>${j.nombre}</div>
            `).join('');
            document.querySelectorAll('.winner-btn').forEach(btn => {
                btn.addEventListener('click', () => declararGanadorMinijuego(btn.dataset.id, mj));
            });
            mjOv.classList.remove('hidden');
        }

        if (estado.fase === 'fin') {
            const sorted = jugadores.slice().sort((a, b) => (b.posicion - a.posicion) || ((b.puntos || 0) - (a.puntos || 0)));
            document.getElementById('finRanking').innerHTML = sorted.map((j, i) => `
                <div class="turn-row"><span>${i===0?'🥇':i===1?'🥈':i===2?'🥉':'▫️'}</span><img class="av-img" src="${j.avatar}" alt=""><span class="nm">${j.nombre}</span><span class="pt">Casilla ${j.posicion} · ${j.puntos||0} pts</span></div>
            `).join('');
            finOv.classList.remove('hidden');
        }
    }

    function declararGanadorMinijuego(winnerId, mj) {
        const winner = jugadores.find(j => j.id === winnerId);
        if (!winner) return;
        const nuevaPos = Math.min(BOARD_SIZE, winner.posicion + mj.diceValue);
        db.collection('jugadores').doc(winnerId).update({
            posicion: nuevaPos, terminado: nuevaPos >= BOARD_SIZE,
        }).then(() => {
            avanzarTurno(`🎉 ${winner.nombre} ganó el reto grupal "${mj.titulo}" y avanzó ${mj.diceValue} casillas`);
        });
    }

    function avanzarTurno(logMsg) {
        const order = estado.turnOrder || [];
        if (order.length === 0) return;
        const idx = (estado.turnIndex + 1) % order.length;
        const next = order[idx];

        db.collection('jugadores').doc(next).get().then((nextSnap) => {
            const nextData = nextSnap.data() || {};
            db.collection('partida').doc('estado').update({
                fase: 'esperando_tiro', turnIndex: idx, jugadorActivo: next,
                jugadorActivoNombre: nextData.nombre || '',
                jugadorPregunta: null, jugadorPreguntaNombre: null,
                preguntaActualId: null, minijuegoActivo: null,
                log: firebase.firestore.FieldValue.arrayUnion(logMsg),
            });
        });
    }

    // ============================================================
    // CONTROLES DEL ADMIN
    // ============================================================
    document.getElementById('btnIniciar').addEventListener('click', () => {
        if (!jugadores.length) { alert('Aún no hay jugadores registrados.'); return; }
        const turnOrder = jugadores.map(j => j.id);
        const first = jugadores[0];
        db.collection('partida').doc('estado').set({
            fase: 'esperando_tiro', turnOrder, turnIndex: 0,
            jugadorActivo: first.id, jugadorActivoNombre: first.nombre,
            log: [`🎬 ¡Partida iniciada con ${jugadores.length} jugadores!`],
            ganadores: [],
        });
    });

    document.getElementById('btnFinalizar').addEventListener('click', () => {
        db.collection('partida').doc('estado').update({ fase: 'fin' });
    });
</script>
</body>
</html>
