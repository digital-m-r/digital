<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BMM Play - Digital Party</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial;
            background: #e9ecef;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }

        .view { display: none; width: 100%; max-width: 420px; text-align: center; }
        .active { display: block; }

        .caja-blanca {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin: 20px 0;
        }

        .header-logos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            width: 100%;
        }

        .logo-izq { height: 25px; object-fit: contain; }
        .logo-der { height: 85px; object-fit: contain; }

        h2.titulo { color: #0032A0; margin: 0 0 4px; }
        .subtitulo { color: #666; font-size: 13px; margin-bottom: 18px; }

        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
            justify-items: center;
        }

        .avatar-opt {
            width: 55px;
            height: 55px;
            border: 3px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            padding: 5px;
            background: #f8f9fa;
        }

        .avatar-opt.selected { border-color: #0032A0; background: #dbeafe; }
        .avatar-opt img { width: 100%; height: 100%; object-fit: contain; }

        button.btn-unirse {
            background: #0032A0;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        button.btn-unirse:disabled { opacity: .4; cursor: not-allowed; }

        .me-strip {
            display: flex; align-items: center; gap: 12px; padding: 10px 14px;
            background: white; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,.06); margin-bottom: 16px;
        }
        .me-avatar { width: 40px; height: 40px; }
        .me-avatar img { width: 100%; height: 100%; object-fit: contain; }
        .me-info { flex: 1; text-align: left; }
        .me-name { font-weight: 700; font-size: 15px; }
        .me-pos { font-size: 12px; color: #666; }

        .status-box { color: #666; font-size: 15px; padding: 10px 0; }
        .turn-banner { color: #0032A0; font-size: 24px; font-weight: 800; margin-bottom: 10px; animation: bounce 1s infinite; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        .dice-wrap { display: flex; justify-content: center; margin: 16px 0 20px; }
        .dice-scene { width: 100px; height: 100px; perspective: 600px; }
        .dice-cube {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
            transition: transform 1.1s cubic-bezier(.25,1,.4,1); transform: rotateX(0deg) rotateY(0deg);
        }
        .dice-face {
            position: absolute; width: 100px; height: 100px; background: #fff; border-radius: 16px;
            border: 2px solid #ddd; display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr);
            padding: 14px; box-shadow: 0 4px 10px rgba(0,0,0,.08);
        }
        .dice-face .pip { width: 14px; height: 14px; border-radius: 50%; background: #0032A0; align-self: center; justify-self: center; opacity: 0; }
        .f-front { transform: translateZ(50px); }
        .f-back { transform: rotateY(180deg) translateZ(50px); }
        .f-right { transform: rotateY(90deg) translateZ(50px); }
        .f-left { transform: rotateY(-90deg) translateZ(50px); }
        .f-top { transform: rotateX(90deg) translateZ(50px); }
        .f-bottom { transform: rotateX(-90deg) translateZ(50px); }
        .p1{grid-area:1/1;} .p2{grid-area:1/2;} .p3{grid-area:1/3;}
        .p4{grid-area:2/1;} .p5{grid-area:2/2;} .p6{grid-area:2/3;}
        .p7{grid-area:3/1;} .p8{grid-area:3/2;} .p9{grid-area:3/3;}
        .roll-result { font-weight: 700; color: #666; min-height: 22px; }
        .roll-result-big { font-size: 42px; font-weight: 900; color: #0032A0; margin-top: 4px; min-height: 50px; }
        .link-atorado { display: inline-block; margin-top: 14px; font-size: 12px; color: #999; text-decoration: underline; cursor: pointer; background: none; border: none; }

        .q-cat { display: inline-block; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px; color: white; margin-bottom: 12px; }
        .q-text { font-size: 17px; font-weight: 600; margin-bottom: 16px; line-height: 1.4; color: #1a1a1a; }
        .q-opt {
            display: block; width: 100%; text-align: left; padding: 13px 16px; margin-bottom: 10px;
            border-radius: 10px; border: 1px solid #ddd; background: #f8f9fa; color: #1a1a1a; font-size: 15px; cursor: pointer;
        }
        .q-opt:hover { border-color: #0032A0; }
        .q-opt.correct { border-color: #26890c; background: #e8f6e6; font-weight: 700; }
        .q-opt.incorrect { border-color: #e21b3c; background: #fbe6e9; }
        .q-opt:disabled { cursor: default; }
        .explicacion { background: #f1f3ff; border-radius: 10px; padding: 14px 16px; margin-top: 10px; font-size: 14px; color: #333; border-left: 4px solid #0032A0; text-align: left; }

        .minigame-banner .emoji { font-size: 44px; }
        .minigame-banner h3 { color: #d89e00; margin: 10px 0; }
        .minigame-banner p { color: #666; font-size: 14px; line-height: 1.5; }
    </style>
</head>

<body>

    <!-- ===== REGISTRO ===== -->
    <div id="view-login" class="view active">
        <div class="caja-blanca">
            <div class="header-logos">
                <img src="img/logo_beiersdorf.png" alt="Beiersdorf" class="logo-izq">
                <img src="img/logo_digital.png" alt="Digital" class="logo-der">
            </div>

            <h2 class="titulo">Bienvenido a Digital Party</h2>
            <div class="subtitulo">RPA → Dashboards → Power Apps → Power Automate → IA</div>

            <input type="text" id="in-nombre" placeholder="Tu Nombre">
            <input type="text" id="in-nomina" placeholder="Tu Nómina">

            <p style="font-weight: bold;">Elige tu Avatar:</p>
            <div class="avatar-grid" id="avatarGrid"></div>

            <button class="btn-unirse" id="btnRegistrar">Entrar</button>
        </div>
    </div>

    <!-- ===== JUEGO ===== -->
    <div id="view-juego" class="view">
        <div class="me-strip">
            <div class="me-avatar" id="meAvatar"></div>
            <div class="me-info">
                <div class="me-name" id="meNombre">—</div>
                <div class="me-pos" id="mePos">Casilla 0 · Inicio</div>
            </div>
        </div>
        <div class="caja-blanca" id="stateArea"></div>
    </div>

<script>
    // ============================================================
    // FIREBASE
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyBcUvlkAYzZqQluQ_xtRpz_4DFWNnfsx-k",
        authDomain: "bmm-digital-party.firebaseapp.com",
        projectId: "bmm-digital-party",
        storageBucket: "bmm-digital-party.firebasestorage.app",
        messagingSenderId: "354189165898",
        appId: "1:354189165898:web:d9d18278172ab0198e6db3",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ============================================================
    // TABLERO — categorías, avatares, casillas especiales
    // ============================================================
    const CATEGORIES = {
        RPA:           { label:'RPA',                      emoji:'🤖', color:'#FF6B6B' },
        DASHBOARDS:    { label:'Dashboards',                emoji:'📊', color:'#FFB84D' },
        POWERAPPS:     { label:'Power Apps',                emoji:'📱', color:'#FF6FB5' },
        POWERAUTOMATE: { label:'Power Automate',            emoji:'⚡', color:'#1368ce' },
        IA:            { label:'Inteligencia Artificial',   emoji:'🧠', color:'#8b5cf6' },
    };
    const BOARD_SIZE = 30;
    const MINIGAME_SQUARES = [8, 16, 24];
    const LADDERS = { 4:14, 9:21, 17:27 };
    const SNAKES  = { 26:10, 22:13, 12:2 };

    // Cada casilla de categoría tiene UNA sola pregunta fija — nunca se repiten.
    const CASILLA_CATEGORIA = {
        1:'RPA', 7:'RPA', 15:'RPA', 23:'RPA',
        2:'DASHBOARDS', 10:'DASHBOARDS', 18:'DASHBOARDS', 25:'DASHBOARDS',
        3:'POWERAPPS', 11:'POWERAPPS', 19:'POWERAPPS', 27:'POWERAPPS',
        5:'POWERAUTOMATE', 13:'POWERAUTOMATE', 20:'POWERAUTOMATE', 28:'POWERAUTOMATE',
        6:'IA', 14:'IA', 21:'IA', 29:'IA',
    };

    const PREGUNTAS_POR_CASILLA = {
        1: { categoria:'RPA', pregunta:'¿Qué tipo de tarea es ideal para automatizar con RPA?', opciones:['Una tarea repetitiva y basada en reglas','Una decisión estratégica de negocio','Una conversación creativa','Un diseño gráfico nuevo'], correcta:0, explicacion:'RPA brilla en tareas repetitivas y basadas en reglas — como copiar datos entre sistemas — no en decisiones creativas o estratégicas.' },
        7: { categoria:'RPA', pregunta:"¿Qué hace básicamente un 'robot' de RPA?", opciones:['Imita los clics y el tecleo que antes hacía una persona','Diseña interfaces visuales','Genera texto e imágenes','Analiza tendencias de mercado'], correcta:0, explicacion:'Un robot de RPA repite pasos manuales (clics, copiar/pegar, tecleo) en los sistemas existentes, tal como los haría una persona.' },
        15: { categoria:'RPA', pregunta:'En BMM, ¿para qué se ha usado RPA?', opciones:['Crear apps móviles','Automatizar macros repetitivas de SAP','Generar texto con IA','Diseñar dashboards'], correcta:1, explicacion:'Un ejemplo real en BMM es automatizar macros de Excel/SAP (como MB52, LX02) que antes se corrían manualmente.' },
        23: { categoria:'RPA', pregunta:'¿Cuál es el mayor beneficio de usar RPA en tareas operativas?', opciones:['Ahorra tiempo humano en pasos repetitivos y reduce errores','Reemplaza la necesidad de tener datos','Sustituye por completo la toma de decisiones','Elimina la necesidad de sistemas existentes'], correcta:0, explicacion:'RPA no reemplaza sistemas ni decisiones — libera tiempo humano al encargarse de los pasos repetitivos y reduce errores de captura.' },

        2: { categoria:'DASHBOARDS', pregunta:'¿Para qué sirve principalmente un dashboard?', opciones:['Para automatizar tareas repetitivas','Para visualizar información clave de un vistazo','Para almacenar archivos','Para conversar con un asistente'], correcta:1, explicacion:'Un dashboard convierte datos en decisiones: resume lo esencial para verlo rápido, sin automatizar nada por sí mismo.' },
        10: { categoria:'DASHBOARDS', pregunta:"Si quieres saber 'cómo va la producción hoy' sin leer reportes largos, usas...", opciones:['Un bot de RPA','Un dashboard','Un flujo de aprobación','Un modelo de lenguaje'], correcta:1, explicacion:'Los dashboards están hechos justo para eso: dar una vista rápida y visual del estado actual.' },
        18: { categoria:'DASHBOARDS', pregunta:'¿Qué hace fuerte a un buen indicador (KPI) en un dashboard?', opciones:['Que sea medible y accionable, conectado a una meta real','Que tenga muchos colores','Que ocupe toda la pantalla','Que se actualice una vez al año'], correcta:0, explicacion:'Un KPI útil se puede medir, lleva a una acción concreta, y está conectado a un objetivo real del negocio.' },
        25: { categoria:'DASHBOARDS', pregunta:'¿Cuál de estas NO es una función típica de un dashboard?', opciones:['Mostrar tendencias con gráficas','Resumir datos de varias fuentes','Automatizar el envío de correos','Ayudar a decidir rápido'], correcta:2, explicacion:'Automatizar envíos de correo es tarea de Power Automate, no de un dashboard — un dashboard solo visualiza.' },

        3: { categoria:'POWERAPPS', pregunta:'¿Para qué se usa principalmente Power Apps?', opciones:['Para crear aplicaciones personalizadas sin programar desde cero','Para analizar grandes volúmenes de datos','Para enviar correos automáticos','Para entrenar modelos de IA'], correcta:0, explicacion:'Power Apps permite construir apps a la medida (formularios, seguimientos, etc.) sin necesidad de programación tradicional.' },
        11: { categoria:'POWERAPPS', pregunta:'Una app hecha en Power Apps normalmente guarda su información en...', opciones:['Fuentes como SharePoint o Excel','Servidores físicos dedicados','Cámaras de seguridad','Impresoras 3D'], correcta:0, explicacion:'Power Apps se conecta a fuentes de datos como listas de SharePoint o Excel para guardar y leer información.' },
        19: { categoria:'POWERAPPS', pregunta:'¿Cuál es un ejemplo típico de app hecha en Power Apps dentro de BMM?', opciones:['Una app para reservar escritorios o dar seguimiento a solicitudes','Un modelo que genera texto','Un dashboard de ventas','Un flujo que envía correos solo'], correcta:0, explicacion:'En BMM se han creado apps como reserva de lugares o seguimiento de trámites — justo el tipo de caso ideal para Power Apps.' },
        27: { categoria:'POWERAPPS', pregunta:'¿Cuál es la diferencia clave entre Power Apps y un dashboard?', opciones:['Power Apps permite capturar y modificar datos, no solo verlos','Power Apps solo muestra información','Power Apps no se conecta a bases de datos','Power Apps es exclusivo para celulares'], correcta:0, explicacion:'Un dashboard es para ver información; Power Apps es para capturarla, modificarla y accionar sobre ella.' },

        5: { categoria:'POWERAUTOMATE', pregunta:'¿Para qué sirve principalmente Power Automate?', opciones:['Para conectar sistemas y automatizar flujos de trabajo entre ellos','Para diseñar interfaces visuales','Para almacenar bases de datos','Para entrenar modelos de IA'], correcta:0, explicacion:'Power Automate mueve información y dispara acciones entre distintos sistemas, sin intervención manual.' },
        13: { categoria:'POWERAUTOMATE', pregunta:'¿Cuál es un ejemplo típico de flujo en Power Automate?', opciones:['Enviar un correo automático cuando llega un archivo nuevo','Crear un dashboard visual','Escribir un reporte con IA','Diseñar un formulario'], correcta:0, explicacion:'Ese tipo de disparador-acción (llega un archivo → se envía un correo) es el caso de uso más común de Power Automate.' },
        20: { categoria:'POWERAUTOMATE', pregunta:'¿Qué diferencia principal hay entre Power Apps y Power Automate?', opciones:["Power Automate trabaja 'detrás de cámaras' conectando sistemas, sin pantalla que el usuario llene",'Power Automate es solo para celulares','Power Automate sirve para generar imágenes','Power Automate reemplaza a SharePoint'], correcta:0, explicacion:'Power Apps tiene una pantalla que el usuario ve y usa; Power Automate corre en segundo plano moviendo datos y disparando acciones.' },
        28: { categoria:'POWERAUTOMATE', pregunta:'¿Qué se necesita para que un flujo de Power Automate se dispare?', opciones:['Un evento inicial, como recibir un correo o que llegue un archivo','Una impresora conectada','Un servidor físico dedicado','Una videollamada activa'], correcta:0, explicacion:"Todo flujo empieza con un 'trigger': el evento que lo pone en marcha." },

        6: { categoria:'IA', pregunta:'¿Para qué sirve un agente de IA conversacional (como Copilot)?', opciones:['Para responder preguntas y ayudar con tareas usando lenguaje natural','Para almacenar archivos','Para conectar flujos automáticos','Para mostrar gráficas de ventas'], correcta:0, explicacion:'Un agente conversacional entiende lenguaje natural y puede responder o ejecutar acciones según se le pida.' },
        14: { categoria:'IA', pregunta:"¿Qué significa que un modelo de IA 'alucine'?", opciones:['Que se apaga solo','Que inventa información que suena creíble pero es falsa','Que tarda mucho en responder','Que pide permisos especiales'], correcta:1, explicacion:'Una alucinación es contenido generado con confianza, pero sin base real — por eso siempre conviene verificar.' },
        21: { categoria:'IA', pregunta:'¿Cuál es una buena práctica al usar IA generativa para el trabajo?', opciones:['Confiar siempre en la respuesta sin revisar','Verificar la información importante antes de usarla','Nunca dar contexto','Evitar hacer preguntas claras'], correcta:1, explicacion:'La IA generativa es una gran ayuda, pero la información importante siempre debe verificarse antes de usarse.' },
        29: { categoria:'IA', pregunta:'¿En qué se diferencia la IA de un robot de RPA?', opciones:['La IA puede interpretar lenguaje y generar respuestas nuevas, no solo repetir pasos fijos','La IA solo repite clics grabados','La IA no puede responder preguntas','La IA es exclusiva de Excel'], correcta:0, explicacion:'RPA sigue pasos fijos y predefinidos; la IA puede entender contexto y generar respuestas o contenido nuevo.' },
    };

    // Retos grupales — quiz cronometrado dentro de la app, gana el primero en acertar
    const RETO_DURACION_MS = 15000;
    const MINIJUEGOS_POR_CASILLA = {
        8: { pregunta: 'El equipo de calidad quiere reportar defectos desde la línea: tomar una foto, elegir el tipo de defecto de una lista, y que quede guardado al instante para que el supervisor lo revise ese mismo día — sin papel. ¿Qué tecnología resuelve mejor este caso?', opciones: ['Power Apps', 'Un dashboard', 'Un robot de RPA', 'Solo Power Automate'], correcta: 0 },
        16: { pregunta: 'Cada vez que un proveedor sube un archivo a una carpeta compartida, alguien tiene que copiarlo a otro sistema y avisar por correo al equipo — hoy lo hace una persona a mano, todos los días. ¿Qué tecnología automatiza mejor este proceso completo?', opciones: ['Power Automate', 'Un dashboard', 'Power Apps', 'Un modelo de IA generativa'], correcta: 0 },
        24: { pregunta: 'El gerente de planta quiere revisar, sin pedirle nada a nadie, cómo van las metas de producción de las últimas 4 semanas y detectar de un vistazo en qué línea hay más paros. ¿Qué tecnología le conviene más?', opciones: ['Un dashboard', 'Un robot de RPA', 'Una app de Power Apps', 'Un flujo de Power Automate'], correcta: 0 },
    };

    const AVATARES = [
        { id:'nivea',    label:'Nivea',    img:'img/nivea.png' },
        { id:'eucerin',  label:'Eucerin',  img:'img/eucerin.png' },
        { id:'atrix',    label:'Atrix',    img:'img/atrix.png' },
        { id:'aquaphor', label:'Aquaphor', img:'img/aquaphor.png' },
        { id:'shower',   label:'Shower',   img:'img/shower.png' },
        { id:'labello',  label:'Labello',  img:'img/labello.png' },
        { id:'rollon',   label:'RollOn',   img:'img/rollon.png' },
        { id:'ph5',      label:'PH5',      img:'img/ph5.png' },
    ];

    function resolveMovement(fromPos, diceValue) {
        let landedRaw = fromPos + diceValue;
        let meta = false;
        if (landedRaw >= BOARD_SIZE) { landedRaw = BOARD_SIZE; meta = true; }

        let final = landedRaw, evento = 'ninguno';

        if (!meta) {
            if (LADDERS[landedRaw]) { final = LADDERS[landedRaw]; evento = 'escalera'; }
            else if (SNAKES[landedRaw]) { final = SNAKES[landedRaw]; evento = 'serpiente'; }
            else if (MINIGAME_SQUARES.includes(landedRaw)) { evento = 'minijuego'; }
            else { evento = 'pregunta'; }
        } else {
            evento = 'meta';
        }

        return { casillaAterrizaje: landedRaw, casillaFinal: final, evento };
    }

    // ============================================================
    // REGISTRO
    // ============================================================
    const viewLogin = document.getElementById('view-login');
    const viewJuego = document.getElementById('view-juego');
    const avatarGrid = document.getElementById('avatarGrid');
    const stateArea = document.getElementById('stateArea');

    let selectedAvatar = AVATARES[0].img;
    let myId = localStorage.getItem('bmmPartyPlayerId');
    let myData = null;
    let estado = null;
    let answeredThisQuestion = false;
    let miUltimoTurnoTirado = null; // evita tirar el dado dos veces en el mismo turno

    AVATARES.forEach((a, i) => {
        const el = document.createElement('div');
        el.className = 'avatar-opt' + (i === 0 ? ' selected' : '');
        el.innerHTML = `<img src="${a.img}" alt="${a.label}">`;
        el.addEventListener('click', () => {
            document.querySelectorAll('.avatar-opt').forEach(x => x.classList.remove('selected'));
            el.classList.add('selected');
            selectedAvatar = a.img;
        });
        avatarGrid.appendChild(el);
    });

    document.getElementById('btnRegistrar').addEventListener('click', () => {
        const nombre = document.getElementById('in-nombre').value.trim();
        const nomina = document.getElementById('in-nomina').value.trim();
        if (!nombre || !nomina) { alert('Completa tu nombre y tu nómina'); return; }

        db.collection('jugadores').add({
            nombre, nomina, avatar: selectedAvatar, posicion: 0, puntos: 0,
            terminado: false, conectado: true,
            creado: firebase.firestore.FieldValue.serverTimestamp(),
        }).then((ref) => {
            myId = ref.id;
            localStorage.setItem('bmmPartyPlayerId', myId);
            startGame();
        });
    });

    if (myId) {
        db.collection('jugadores').doc(myId).get().then((snap) => {
            if (snap.exists) { startGame(); }
            else { localStorage.removeItem('bmmPartyPlayerId'); }
        });
    }

    // ============================================================
    // JUEGO
    // ============================================================
    function startGame() {
        viewLogin.classList.remove('active');
        viewJuego.classList.add('active');

        db.collection('jugadores').doc(myId).onSnapshot((snap) => {
            myData = snap.data();
            if (!myData) return;
            document.getElementById('meAvatar').innerHTML = `<img src="${myData.avatar}" alt="avatar">`;
            document.getElementById('meNombre').textContent = myData.nombre;
            document.getElementById('mePos').textContent = myData.terminado
                ? '🏆 ¡Llegaste a la meta!'
                : `Casilla ${myData.posicion} de 30`;
            render();
        });

        db.collection('partida').doc('estado').onSnapshot((snap) => {
            estado = snap.data();
            if (estado && estado.fase === 'pregunta' && estado.jugadorPregunta !== myId) answeredThisQuestion = false;
            render();
        });
    }

    function render() {
        if (!estado || !myData) return;

        if (estado.fase === 'lobby') {
            stateArea.innerHTML = `<div class="status-box">Esperando a que el administrador inicie la partida...</div>`;
            return;
        }
        if (estado.fase === 'fin') {
            stateArea.innerHTML = `<div class="status-box"><h3 style="color:#0032A0">🏁 ¡Partida terminada!</h3><p>Revisa el podio en la pantalla principal.</p></div>`;
            return;
        }

        const esMiTurno = estado.jugadorActivo === myId;

        if (estado.fase === 'esperando_tiro') {
            if (esMiTurno) {
                if (estado.turnCounter !== undefined && estado.turnCounter === miUltimoTurnoTirado) {
                    stateArea.innerHTML = `
                        <div class="status-box">Procesando tu turno...</div>
                        <button class="link-atorado" id="btnAtorado">¿Se quedó atorado? Toca para actualizar</button>`;
                    document.getElementById('btnAtorado').addEventListener('click', forzarActualizacion);
                    return;
                }
                stateArea.innerHTML = `
                    <div class="turn-banner">🎉 ¡ES TU TURNO! 🎉</div>
                    <div class="dice-wrap"><div class="dice-scene"><div class="dice-cube" id="diceCube">${diceFaces()}</div></div></div>
                    <div class="roll-result" id="rollResult">Toca el botón para tirar</div>
                    <div class="roll-result-big" id="rollResultBig"></div>
                    <button class="btn-unirse" id="btnTirar" style="margin-top:14px;">🎲 Tirar el dado</button>`;
                document.getElementById('btnTirar').addEventListener('click', tirarDado);
            } else {
                stateArea.innerHTML = `<div class="status-box">Esperando el turno de <strong>${estado.jugadorActivoNombre || '...'}</strong></div>`;
            }
            return;
        }

        if (estado.fase === 'pregunta') {
            if (estado.jugadorPregunta === myId) renderPregunta();
            else stateArea.innerHTML = `<div class="status-box">${estado.jugadorPreguntaNombre} está respondiendo una pregunta de ${(CATEGORIES[estado.categoriaActual] || {}).label || ''}. Mira la pantalla principal.</div>`;
            return;
        }

        if (estado.fase === 'minijuego') {
            renderMinijuego();
            return;
        }

        stateArea.innerHTML = `<div class="status-box">Sincronizando...</div>`;
    }

    let miRespuestaMinijuegoCasilla = null; // recuerda si ya respondí este reto en particular
    let contadorMinijuegoInterval = null;

    function renderMinijuego() {
        if (contadorMinijuegoInterval) { clearInterval(contadorMinijuegoInterval); contadorMinijuegoInterval = null; }
        const mj = estado.minijuegoActivo || {};
        const q = MINIJUEGOS_POR_CASILLA[mj.casilla];
        if (!q) { stateArea.innerHTML = `<div class="status-box">Cargando reto...</div>`; return; }

        const yaResponditEste = miRespuestaMinijuegoCasilla === mj.inicio;
        const yaTengoRespuesta = mj.respuestas && mj.respuestas[myId];

        if (yaResponditEste || yaTengoRespuesta) {
            stateArea.innerHTML = `
                <div class="minigame-banner">
                    <div class="emoji">✅</div>
                    <h3 style="color:#0032A0;">¡Respuesta enviada!</h3>
                    <p>Esperando a que termine el tiempo y se calcule quién ganó...</p>
                </div>`;
            return;
        }

        stateArea.innerHTML = `
            <div>
                <span class="q-cat" style="background:#d89e00;">⭐ RETO GRUPAL</span>
                <div id="mjCountdown" style="font-size:15px; font-weight:800; color:#e21b3c; margin-bottom:10px;"></div>
                <div class="q-text">${q.pregunta}</div>
                <div id="mjOpts">${q.opciones.map((op, i) => `<button class="q-opt" data-i="${i}">${op}</button>`).join('')}</div>
            </div>`;

        document.querySelectorAll('#mjOpts .q-opt').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#mjOpts .q-opt').forEach(b => b.disabled = true);
                miRespuestaMinijuegoCasilla = mj.inicio;
                enviarRespuestaMinijuego(parseInt(btn.dataset.i), mj, q);
            });
        });

        contadorMinijuegoInterval = setInterval(() => {
            const restante = Math.max(0, Math.ceil((mj.inicio + mj.duracionMs - Date.now()) / 1000));
            const el = document.getElementById('mjCountdown');
            if (el) el.textContent = `⏱️ ${restante}s`;
            if (restante <= 0) clearInterval(contadorMinijuegoInterval);
        }, 250);
    }

    function enviarRespuestaMinijuego(i, mj, q) {
        const correcto = i === q.correcta;
        db.collection('partida').doc('estado').update({
            [`minijuegoActivo.respuestas.${myId}`]: { opcion: i, tiempoMs: Date.now() - mj.inicio, correcto },
        }).catch((err) => console.error('Error al enviar respuesta del reto:', err));
    }

    function resolverMinijuego(casillaEsperada, inicioEsperado) {
        db.collection('partida').doc('estado').get().then((snap) => {
            const est = snap.data();
            if (!est || est.fase !== 'minijuego') return; // ya se resolvió (o cambió de turno)
            const mj = est.minijuegoActivo || {};
            if (mj.casilla !== casillaEsperada || mj.inicio !== inicioEsperado) return; // ya es otro reto

            const respuestas = mj.respuestas || {};
            const correctas = Object.keys(respuestas)
                .map(id => Object.assign({ id }, respuestas[id]))
                .filter(r => r.correcto)
                .sort((a, b) => a.tiempoMs - b.tiempoMs);

            if (correctas.length === 0) {
                db.collection('partida').doc('estado').update({ fase: 'esperando_tiro' }).then(() => {
                    avanzarTurno(`⭐ Reto grupal: nadie acertó a tiempo, nadie avanza.`);
                });
                return;
            }

            const ganador = correctas[0];
            db.collection('jugadores').doc(ganador.id).get().then((gSnap) => {
                const gData = gSnap.data() || {};
                const nuevaPos = Math.min(BOARD_SIZE, (gData.posicion || 0) + mj.diceValue);
                db.collection('jugadores').doc(ganador.id).update({
                    posicion: nuevaPos, terminado: nuevaPos >= BOARD_SIZE,
                }).then(() => {
                    avanzarTurno(`⭐ ¡${gData.nombre} ganó el reto grupal y avanzó ${mj.diceValue} casillas!`);
                });
            });
        }).catch((err) => console.error('Error al resolver el reto grupal:', err));
    }

    function diceFaces() {
        const faces = { front:[5], back:[9], right:[1,3,7,9], left:[1,5,9], top:[1,3,5,7,9], bottom:[1,3,7,9] };
        const wrap = (cls, pipsList) => `<div class="dice-face ${cls}">${Array.from({length:9},(_,i)=>{
            const n=i+1; return pipsList.includes(n) ? `<div class="pip" style="opacity:1"></div>` : `<div class="pip"></div>`;
        }).join('')}</div>`;
        return wrap('f-front', faces.front) + wrap('f-back', faces.back) + wrap('f-right', faces.right) +
               wrap('f-left', faces.left) + wrap('f-top', faces.top) + wrap('f-bottom', faces.bottom);
    }

    const FACE_ROTATION = { 1:{x:0,y:0}, 6:{x:0,y:180}, 3:{x:0,y:-90}, 4:{x:0,y:90}, 2:{x:-90,y:0}, 5:{x:90,y:0} };

    function mostrarErrorTurno(err) {
        console.error('Error al procesar el turno:', err);
        miUltimoTurnoTirado = null;
        alert('Hubo un problema al procesar tu turno. Vuelve a intentar tirar el dado.');
        render();
    }

    function forzarActualizacion() {
        db.collection('partida').doc('estado').get().then((snap) => {
            estado = snap.data();
            render();
        }).catch((err) => console.error('Error al actualizar:', err));
    }

    function tirarDado() {
        document.getElementById('btnTirar').disabled = true;
        miUltimoTurnoTirado = estado.turnCounter;
        const valor = Math.floor(Math.random() * 6) + 1;
        const cube = document.getElementById('diceCube');
        const base = FACE_ROTATION[valor];
        const extraX = 720 + Math.floor(Math.random()*360);
        const extraY = 1080 + Math.floor(Math.random()*360);
        cube.style.transform = `rotateX(${extraX + base.x}deg) rotateY(${extraY + base.y}deg)`;

        setTimeout(() => {
            document.getElementById('rollResult').textContent = `🎲 Resultado real:`;
            const rrb = document.getElementById('rollResultBig');
            if (rrb) rrb.textContent = valor;
            const mov = resolveMovement(myData.posicion, valor);
            const nombreLog = `${myData.nombre} tiró ${valor} → casilla ${mov.casillaAterrizaje}`;
            const estadoRef = db.collection('partida').doc('estado');

            db.collection('jugadores').doc(myId).update({
                posicion: mov.casillaFinal, terminado: mov.evento === 'meta',
            }).then(() => {
                if (mov.evento === 'pregunta') {
                    const categoria = CASILLA_CATEGORIA[mov.casillaAterrizaje];
                    estadoRef.update({
                        fase: 'pregunta', ultimoResultadoDado: valor,
                        categoriaActual: categoria, casillaAterrizaje: mov.casillaAterrizaje,
                        jugadorPregunta: myId, jugadorPreguntaNombre: myData.nombre,
                    }).catch(mostrarErrorTurno);
                } else if (mov.evento === 'escalera' || mov.evento === 'serpiente') {
                    estadoRef.update({ ultimoResultadoDado: valor, casillaAterrizaje: mov.casillaAterrizaje, ultimoEvento: mov.evento })
                        .then(() => setTimeout(() => avanzarTurno(nombreLog + (mov.evento === 'escalera' ? ' 🪜 ¡Escalera!' : ' 🐍 ¡Serpiente!')), 1800))
                        .catch(mostrarErrorTurno);
                } else if (mov.evento === 'minijuego') {
                    const inicioTs = Date.now();
                    estadoRef.update({
                        fase: 'minijuego', ultimoResultadoDado: valor, casillaAterrizaje: mov.casillaAterrizaje,
                        minijuegoActivo: {
                            casilla: mov.casillaAterrizaje, inicio: inicioTs, duracionMs: RETO_DURACION_MS,
                            diceValue: valor, jugadorOrigen: myId, jugadorOrigenNombre: myData.nombre, respuestas: {},
                        },
                    }).then(() => {
                        setTimeout(() => resolverMinijuego(mov.casillaAterrizaje, inicioTs), RETO_DURACION_MS + 800);
                    }).catch(mostrarErrorTurno);
                } else if (mov.evento === 'meta') {
                    estadoRef.update({
                        ultimoResultadoDado: valor, casillaAterrizaje: mov.casillaAterrizaje,
                        ganadores: firebase.firestore.FieldValue.arrayUnion({ id: myId, nombre: myData.nombre, avatar: myData.avatar }),
                    }).then(() => setTimeout(() => avanzarTurno(`🏆 ¡${myData.nombre} llegó a la meta!`), 1500))
                        .catch(mostrarErrorTurno);
                }
            }).catch(mostrarErrorTurno);
        }, 1150);
    }

    function renderPregunta() {
        if (document.getElementById('qCard')) return;
        const q = PREGUNTAS_POR_CASILLA[estado.casillaAterrizaje];
        if (!q) return;
        const cat = CATEGORIES[q.categoria];

        stateArea.innerHTML = `
            <div id="qCard">
                <span class="q-cat" style="background:${cat.color}">${cat.emoji} ${cat.label}</span>
                <div class="q-text">${q.pregunta}</div>
                <div id="qOpts">${q.opciones.map((op, i) => `<button class="q-opt" data-i="${i}">${op}</button>`).join('')}</div>
                <div id="qExplain"></div>
            </div>`;

        document.querySelectorAll('.q-opt').forEach(btn => {
            btn.addEventListener('click', () => {
                if (answeredThisQuestion) return;
                answeredThisQuestion = true;
                const i = parseInt(btn.dataset.i);
                document.querySelectorAll('.q-opt').forEach((b, idx) => {
                    b.disabled = true;
                    if (idx === q.correcta) b.classList.add('correct');
                    else if (idx === i && i !== q.correcta) b.classList.add('incorrect');
                });
                const correcto = i === q.correcta;
                db.collection('jugadores').doc(myId).update({
                    puntos: firebase.firestore.FieldValue.increment(correcto ? 10 : 2),
                });
                document.getElementById('qExplain').innerHTML = `
                    <div class="explicacion">${correcto ? '✅ ¡Correcto!' : '❌ No era esa.'} ${q.explicacion}</div>
                    <button class="btn-unirse" id="btnContinuar" style="margin-top:14px;">Continuar</button>`;
                document.getElementById('btnContinuar').addEventListener('click', () => {
                    avanzarTurno(`${myData.nombre} respondió sobre ${cat.label}: ${correcto ? '✅' : '❌'}`);
                });
            });
        });
    }

    function avanzarTurno(logMsg) {
        const order = estado.turnOrder || [];
        if (order.length === 0) return;
        const idx = (estado.turnIndex + 1) % order.length;
        const next = order[idx];

        db.collection('jugadores').doc(next).get().then((nextSnap) => {
            const nextData = nextSnap.data() || {};
            db.collection('partida').doc('estado').update({
                fase: 'esperando_tiro', turnIndex: idx, jugadorActivo: next,
                jugadorActivoNombre: nextData.nombre || '',
                jugadorPregunta: null, jugadorPreguntaNombre: null,
                minijuegoActivo: null,
                turnCounter: firebase.firestore.FieldValue.increment(1),
                log: firebase.firestore.FieldValue.arrayUnion(logMsg),
            });
        }).catch(mostrarErrorTurno);
    }
</script>
