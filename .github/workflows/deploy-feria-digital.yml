name: Deploy Feria Digital to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'feria-digital/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-feria-digital.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_RETO_DIGITAL_BMM }}'
          projectId: reto-digital-bmm
          target: feria-digital
          channelId: live
