# Guardar en: .github/workflows/deploy-mindy-vuelo.yml (raíz del repo digital-m-r/digital)
name: Deploy Mindy Vuelo Digital
on:
  push:
    branches: [main]
    paths: ["mindy-vuelo/**"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # Usa el mismo secreto que ya tienen Reto Digital / Feria Digital
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RETO_DIGITAL_BMM }}
          channelId: live
          projectId: reto-digital-bmm
          entryPoint: mindy-vuelo
