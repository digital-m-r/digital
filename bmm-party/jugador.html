<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>BMM Digital Party — Jugador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#150F30; --bg-2:#241A54; --panel:#1F1750cc; --panel-solid:#1F1750;
    --border:#3a2d6e; --text:#F5F3FF; --text-muted:#B8AEDC;
    --accent:#7C4DFF; --accent-bright:#9D7CFF; --gold:#FFD34D;
    --rpa:#FF6B6B; --dash:#FFB84D; --papps:#4CD97B; --pauto:#45D6E8; --ia:#B98CFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:'Inter',sans-serif; color:var(--text);
    background:
      radial-gradient(circle at 20% 10%, #2a1f66 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, #2d1a5c 0%, transparent 45%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  h1,h2,h3{font-family:'Baloo 2',sans-serif; margin:0;}
  .card{
    background:var(--panel-solid); border:1px solid var(--border); border-radius:20px;
    padding:32px; width:100%; max-width:460px; box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .header-logos{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .header-logos .logo-izq{height:20px; object-fit:contain;}
  .header-logos .logo-der{height:60px; object-fit:contain;}
  .subtitle{text-align:center; color:var(--text-muted); font-size:13px; margin-bottom:22px;}
  h2.title{text-align:center; font-size:24px; margin-bottom:6px; background:linear-gradient(90deg,var(--accent-bright),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  label{font-size:13px; color:var(--text-muted); display:block; margin-bottom:6px; font-weight:600;}
  input[type=text]{
    width:100%; padding:14px 16px; border-radius:12px; border:1px solid var(--border);
    background:#150F30; color:var(--text); font-size:16px; margin-bottom:18px; outline:none;
  }
  input[type=text]:focus{border-color:var(--accent);}
  .avatar-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:22px;}
  .avatar-opt{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center; padding:8px;
    background:#150F30; border:2px solid var(--border); border-radius:14px; cursor:pointer; transition:.15s;
  }
  .avatar-opt img{width:100%; height:100%; object-fit:contain;}
  .avatar-opt:hover{transform:translateY(-2px);}
  .avatar-opt.selected{border-color:var(--gold); background:#2a1f66; box-shadow:0 0 0 3px rgba(255,211,77,.3);}
  button.primary{
    width:100%; padding:16px; border:none; border-radius:14px; font-size:17px; font-weight:700;
    font-family:'Baloo 2',sans-serif; color:#150F30; background:linear-gradient(90deg,var(--gold),#ffe08a);
    cursor:pointer; transition:.15s;
  }
  button.primary:hover{transform:translateY(-2px); box-shadow:0 8px 24px rgba(255,211,77,.3);}
  button.primary:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none;}
  .hidden{display:none !important;}

  /* ---- Game screen ---- */
  #gameScreen{max-width:520px;}
  .me-strip{display:flex; align-items:center; gap:12px; padding:12px 16px; background:#150F30; border-radius:14px; margin-bottom:20px; border:1px solid var(--border);}
  .me-avatar{width:40px; height:40px;}
  .me-avatar img{width:100%; height:100%; object-fit:contain;}
  .me-info{flex:1;}
  .me-name{font-weight:700; font-size:15px;}
  .me-pos{font-size:12px; color:var(--text-muted);}
  .cat-badge{font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; color:#150F30;}

  .status-box{text-align:center; padding:24px 10px;}
  .status-box.waiting{color:var(--text-muted);}
  .pulse-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--gold); margin-right:6px; animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}

  .turn-banner{text-align:center; font-family:'Baloo 2',sans-serif; font-size:24px; color:var(--gold); margin-bottom:18px; animation:bounce 1s infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

  /* 3D dice */
  .dice-wrap{display:flex; justify-content:center; margin:20px 0 26px;}
  .dice-scene{width:100px; height:100px; perspective:600px;}
  .dice-cube{width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform 1.1s cubic-bezier(.25,1,.4,1); transform:rotateX(0deg) rotateY(0deg);}
  .dice-face{position:absolute; width:100px; height:100px; background:linear-gradient(145deg,#fff,#e4e0f7); border-radius:16px; border:2px solid #cfc6f0; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:14px; box-shadow:inset 0 0 10px rgba(0,0,0,.05);}
  .dice-face .pip{width:14px; height:14px; border-radius:50%; background:#2a1f66; align-self:center; justify-self:center; opacity:0;}
  .f-front{transform:translateZ(50px);}
  .f-back{transform:rotateY(180deg) translateZ(50px);}
  .f-right{transform:rotateY(90deg) translateZ(50px);}
  .f-left{transform:rotateY(-90deg) translateZ(50px);}
  .f-top{transform:rotateX(90deg) translateZ(50px);}
  .f-bottom{transform:rotateX(-90deg) translateZ(50px);}
  /* pip positions per die value, grid areas 1-9 */
  .p1{grid-area:1/1;} .p2{grid-area:1/2;} .p3{grid-area:1/3;}
  .p4{grid-area:2/1;} .p5{grid-area:2/2;} .p6{grid-area:2/3;}
  .p7{grid-area:3/1;} .p8{grid-area:3/2;} .p9{grid-area:3/3;}

  .roll-result{text-align:center; font-family:'Baloo 2',sans-serif; font-size:18px; color:var(--text-muted); min-height:24px;}

  /* Question card */
  .q-card{margin-top:6px;}
  .q-cat{display:inline-block; font-size:12px; font-weight:700; padding:5px 12px; border-radius:999px; color:#150F30; margin-bottom:12px;}
  .q-text{font-size:17px; font-weight:600; margin-bottom:16px; line-height:1.4;}
  .q-opt{
    display:block; width:100%; text-align:left; padding:13px 16px; margin-bottom:10px; border-radius:12px;
    border:1px solid var(--border); background:#150F30; color:var(--text); font-size:15px; cursor:pointer; transition:.15s;
  }
  .q-opt:hover{border-color:var(--accent-bright);}
  .q-opt.correct{border-color:var(--papps); background:#173525;}
  .q-opt.incorrect{border-color:var(--rpa); background:#3a1f22;}
  .q-opt:disabled{cursor:default;}
  .explicacion{background:#150F30; border-radius:12px; padding:14px 16px; margin-top:10px; font-size:14px; color:var(--text-muted); border-left:3px solid var(--gold);}

  .minigame-banner{text-align:center;}
  .minigame-banner .emoji{font-size:44px;}
  .minigame-banner h3{color:var(--gold); margin:10px 0;}
  .minigame-banner p{color:var(--text-muted); font-size:14px; line-height:1.5;}

  .ranking{margin-top:10px;}
  .rank-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:14px;}
</style>
</head>
<body>

<!-- ===== REGISTRO ===== -->
<div class="card" id="registerScreen">
  <div class="header-logos">
    <img src="https://digital-m-r.github.io/digital/img/logo_beiersdorf.png" alt="Beiersdorf" class="logo-izq" />
    <img src="https://digital-m-r.github.io/digital/img/logo_digital.png" alt="Digital Manufacturing" class="logo-der" />
  </div>
  <h2 class="title">🎲 BMM Digital Party</h2>
  <div class="subtitle">RPA → Dashboards → Power Apps → Power Automate → IA</div>

  <label for="inpNombre">Tu nombre</label>
  <input type="text" id="inpNombre" placeholder="ej. Mitzy" maxlength="24" />

  <label for="inpNomina">Tu nómina</label>
  <input type="text" id="inpNomina" placeholder="ej. 12345" maxlength="20" />

  <label>Elige tu avatar</label>
  <div class="avatar-grid" id="avatarGrid"></div>

  <button class="primary" id="btnRegistrar">Entrar al juego</button>
</div>

<!-- ===== JUEGO ===== -->
<div class="card hidden" id="gameScreen">
  <div class="me-strip">
    <div class="me-avatar" id="meAvatar"></div>
    <div class="me-info">
      <div class="me-name" id="meNombre">—</div>
      <div class="me-pos" id="mePos">Casilla 0 · Inicio</div>
    </div>
    <div class="cat-badge" id="meCatBadge" style="display:none;"></div>
  </div>

  <div id="stateArea"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot,
  collection, addDoc, serverTimestamp, increment
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
import { CATEGORIES, resolveMovement, AVATARES } from "./board.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const registerScreen = document.getElementById('registerScreen');
const gameScreen = document.getElementById('gameScreen');
const avatarGrid = document.getElementById('avatarGrid');
const stateArea = document.getElementById('stateArea');

let selectedAvatar = AVATARES[0].img;
let myId = localStorage.getItem('bmmPartyPlayerId');
let myData = null;
let estado = null;
let answeredThisQuestion = false;

// ---- Render avatar picker (imágenes reales) ----
AVATARES.forEach((a, i) => {
  const el = document.createElement('div');
  el.className = 'avatar-opt' + (i === 0 ? ' selected' : '');
  el.innerHTML = `<img src="${a.img}" alt="${a.label}" />`;
  el.addEventListener('click', () => {
    document.querySelectorAll('.avatar-opt').forEach(x => x.classList.remove('selected'));
    el.classList.add('selected');
    selectedAvatar = a.img;
  });
  avatarGrid.appendChild(el);
});

document.getElementById('btnRegistrar').addEventListener('click', async () => {
  const nombre = document.getElementById('inpNombre').value.trim();
  const nomina = document.getElementById('inpNomina').value.trim();
  if (!nombre || !nomina) { alert('Completa tu nombre y tu nómina'); return; }
  const ref = await addDoc(collection(db, 'jugadores'), {
    nombre, nomina, avatar: selectedAvatar, posicion: 0, puntos: 0,
    terminado: false, conectado: true, creado: serverTimestamp(),
  });
  myId = ref.id;
  localStorage.setItem('bmmPartyPlayerId', myId);
  startGame();
});

// ---- Resume session if already registered ----
(async function init() {
  if (myId) {
    const snap = await getDoc(doc(db, 'jugadores', myId));
    if (snap.exists()) { startGame(); return; }
    localStorage.removeItem('bmmPartyPlayerId');
  }
})();

function startGame() {
  registerScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');

  onSnapshot(doc(db, 'jugadores', myId), (snap) => {
    myData = snap.data();
    document.getElementById('meAvatar').innerHTML = `<img src="${myData.avatar}" alt="avatar" />`;
    document.getElementById('meNombre').textContent = myData.nombre;
    document.getElementById('mePos').textContent = myData.terminado
      ? '🏆 ¡Llegaste a la meta!'
      : `Casilla ${myData.posicion} de 30`;
    render();
  });

  onSnapshot(doc(db, 'partida', 'estado'), (snap) => {
    estado = snap.data();
    if (estado?.fase === 'pregunta' && estado.jugadorPregunta !== myId) answeredThisQuestion = false;
    render();
  });
}

function catBadge(catId) {
  const c = CATEGORIES[catId];
  return c ? `<span class="cat-badge" style="background:${c.color}">${c.emoji} ${c.label}</span>` : '';
}

function render() {
  if (!estado || !myData) return;
  const badgeEl = document.getElementById('meCatBadge');
  badgeEl.style.display = 'none';

  if (estado.fase === 'lobby') {
    stateArea.innerHTML = `<div class="status-box waiting"><span class="pulse-dot"></span>Esperando a que el administrador inicie la partida...</div>`;
    return;
  }

  if (estado.fase === 'fin') {
    stateArea.innerHTML = `<div class="status-box"><h3 style="color:var(--gold)">🏁 ¡Partida terminada!</h3><p style="color:var(--text-muted)">Revisa el podio en la pantalla principal.</p></div>`;
    return;
  }

  const esMiTurno = estado.jugadorActivo === myId;

  if (estado.fase === 'esperando_tiro') {
    if (esMiTurno) {
      stateArea.innerHTML = `
        <div class="turn-banner">🎉 ¡ES TU TURNO! 🎉</div>
        <div class="dice-wrap"><div class="dice-scene"><div class="dice-cube" id="diceCube">${diceFaces()}</div></div></div>
        <div class="roll-result" id="rollResult">Toca el botón para tirar</div>
        <button class="primary" id="btnTirar" style="margin-top:14px;">🎲 Tirar el dado</button>
      `;
      document.getElementById('btnTirar').addEventListener('click', tirarDado);
    } else {
      stateArea.innerHTML = `<div class="status-box waiting"><span class="pulse-dot"></span>Esperando el turno de <strong>${estado.jugadorActivoNombre || '...'}</strong></div>`;
    }
    return;
  }

  if (estado.fase === 'pregunta') {
    if (estado.jugadorPregunta === myId) {
      renderPregunta();
    } else {
      stateArea.innerHTML = `<div class="status-box waiting"><span class="pulse-dot"></span>${estado.jugadorPreguntaNombre} está respondiendo una pregunta de ${CATEGORIES[estado.categoriaActual]?.label || ''}...</div>`;
    }
    return;
  }

  if (estado.fase === 'minijuego') {
    const mj = estado.minijuegoActivo || {};
    stateArea.innerHTML = `
      <div class="minigame-banner">
        <div class="emoji">🎉</div>
        <h3>¡Reto grupal! ${mj.titulo || ''}</h3>
        <p>${mj.instrucciones || ''}</p>
        <p style="color:var(--gold); margin-top:14px;">El administrador elegirá al ganador en la pantalla principal.</p>
      </div>`;
    return;
  }

  stateArea.innerHTML = `<div class="status-box waiting">Sincronizando...</div>`;
}

function diceFaces() {
  const faces = {
    front:[5], back:[9], right:[1,3,7,9], left:[1,5,9], top:[1,3,5,7,9], bottom:[1,3,7,9]
  };
  const wrap = (cls, pipsList, val) => `<div class="dice-face ${cls}">${Array.from({length:9},(_,i)=>{
    const n=i+1; return pipsList.includes(n) ? `<div class="pip" style="opacity:1"></div>` : `<div class="pip"></div>`;
  }).join('')}</div>`;
  return wrap('f-front', faces.front) + wrap('f-back', faces.back) + wrap('f-right', faces.right) +
         wrap('f-left', faces.left) + wrap('f-top', faces.top) + wrap('f-bottom', faces.bottom);
}

const FACE_ROTATION = {
  1: {x:0, y:0}, 6: {x:0, y:180}, 3: {x:0, y:-90}, 4: {x:0, y:90}, 2: {x:-90, y:0}, 5: {x:90, y:0},
};

async function tirarDado() {
  document.getElementById('btnTirar').disabled = true;
  const valor = Math.floor(Math.random() * 6) + 1;
  const cube = document.getElementById('diceCube');
  const base = FACE_ROTATION[valor];
  const extraX = 720 + Math.floor(Math.random()*360);
  const extraY = 1080 + Math.floor(Math.random()*360);
  cube.style.transform = `rotateX(${extraX + base.x}deg) rotateY(${extraY + base.y}deg)`;

  setTimeout(async () => {
    document.getElementById('rollResult').textContent = `🎲 Sacaste ${valor}`;
    const mov = resolveMovement(myData.posicion, valor);

    // Update this player's own record (single writer per turn — no race condition)
    await updateDoc(doc(db, 'jugadores', myId), {
      posicion: mov.casillaFinal,
      terminado: mov.evento === 'meta',
    });

    const estadoRef = doc(db, 'partida', 'estado');
    const nombreLog = `${myData.nombre} tiró ${valor} → casilla ${mov.casillaAterrizaje}`;

    if (mov.evento === 'pregunta') {
      const categoria = mov.categoria;
      // pick a question for this category client-side using a lightweight fetch
      const preguntaId = await elegirPregunta(categoria);
      await updateDoc(estadoRef, {
        fase: 'pregunta', ultimoResultadoDado: valor,
        categoriaActual: categoria, preguntaActualId: preguntaId,
        jugadorPregunta: myId, jugadorPreguntaNombre: myData.nombre,
        casillaAterrizaje: mov.casillaAterrizaje,
      });
    } else if (mov.evento === 'escalera' || mov.evento === 'serpiente') {
      await updateDoc(estadoRef, {
        ultimoResultadoDado: valor, casillaAterrizaje: mov.casillaAterrizaje,
        ultimoEvento: mov.evento,
      });
      setTimeout(() => avanzarTurno(nombreLog + (mov.evento === 'escalera' ? ' 🪜 ¡Escalera!' : ' 🐍 ¡Serpiente!')), 1800);
    } else if (mov.evento === 'minijuego') {
      const mjSnap = await getRandomMinijuego();
      await updateDoc(estadoRef, {
        fase: 'minijuego', ultimoResultadoDado: valor,
        casillaAterrizaje: mov.casillaAterrizaje,
        minijuegoActivo: { ...mjSnap, diceValue: valor, jugadorOrigen: myId, jugadorOrigenNombre: myData.nombre },
      });
    } else if (mov.evento === 'meta') {
      await updateDoc(estadoRef, {
        ultimoResultadoDado: valor, casillaAterrizaje: mov.casillaAterrizaje,
        ganadores: [...(estado.ganadores || []), { id: myId, nombre: myData.nombre, avatar: myData.avatar }],
      });
      setTimeout(() => avanzarTurno(`🏆 ¡${myData.nombre} llegó a la meta!`), 1500);
    }
  }, 1150);
}

async function elegirPregunta(categoria) {
  const { getDocs, query, collection: col, where } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js");
  const q = query(col(db, 'preguntas'), where('categoria', '==', categoria));
  const snap = await getDocs(q);
  const ids = snap.docs.map(d => d.id);
  return ids[Math.floor(Math.random() * ids.length)];
}

async function getRandomMinijuego() {
  const { getDocs, collection: col } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js");
  const snap = await getDocs(col(db, 'minijuegos'));
  const docs = snap.docs.map(d => d.data());
  return docs[Math.floor(Math.random() * docs.length)] || { titulo: 'Reto sorpresa', instrucciones: 'El admin propone un reto rápido en voz alta.' };
}

async function renderPregunta() {
  if (document.getElementById('qCard')) return; // avoid re-render flicker while answering
  const { getDoc: gDoc, doc: d } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js");
  const qSnap = await gDoc(d(db, 'preguntas', estado.preguntaActualId));
  const q = qSnap.data();
  const cat = CATEGORIES[q.categoria];

  stateArea.innerHTML = `
    <div class="q-card" id="qCard">
      <span class="q-cat" style="background:${cat.color}">${cat.emoji} ${cat.label}</span>
      <div class="q-text">${q.pregunta}</div>
      <div id="qOpts">
        ${q.opciones.map((op, i) => `<button class="q-opt" data-i="${i}">${op}</button>`).join('')}
      </div>
      <div id="qExplain"></div>
    </div>`;

  document.querySelectorAll('.q-opt').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (answeredThisQuestion) return;
      answeredThisQuestion = true;
      const i = parseInt(btn.dataset.i);
      document.querySelectorAll('.q-opt').forEach((b, idx) => {
        b.disabled = true;
        if (idx === q.correcta) b.classList.add('correct');
        else if (idx === i && i !== q.correcta) b.classList.add('incorrect');
      });
      const correcto = i === q.correcta;
      await updateDoc(doc(db, 'jugadores', myId), { puntos: increment(correcto ? 10 : 2) });
      document.getElementById('qExplain').innerHTML = `
        <div class="explicacion">${correcto ? '✅ ¡Correcto!' : '❌ No era esa.'} ${q.explicacion}</div>
        <button class="primary" id="btnContinuar" style="margin-top:14px;">Continuar</button>`;
      document.getElementById('btnContinuar').addEventListener('click', () => {
        avanzarTurno(`${myData.nombre} respondió sobre ${cat.label}: ${correcto ? '✅' : '❌'}`);
      });
    });
  });
}

async function avanzarTurno(logMsg) {
  const order = estado.turnOrder || [];
  if (order.length === 0) return;
  const idx = (estado.turnIndex + 1) % order.length;
  const next = order[idx];

  const nextSnap = await getDoc(doc(db, 'jugadores', next));
  const nextData = nextSnap.data();

  await updateDoc(doc(db, 'partida', 'estado'), {
    fase: 'esperando_tiro', turnIndex: idx, jugadorActivo: next,
    jugadorActivoNombre: nextData?.nombre || '',
    jugadorPregunta: null, jugadorPreguntaNombre: null,
    preguntaActualId: null, minijuegoActivo: null,
    log: [...(estado.log || []).slice(-19), logMsg],
  });
}
</script>
</body>
</html>
